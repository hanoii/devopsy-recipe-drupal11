; Production PHP settings (on top of php.ini-production).
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000
expose_php = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Code is immutable (a new release is a new image), and Drupal writes compiled
; Twig to new file names instead of overwriting, so nothing needs revalidating.
opcache.validate_timestamps = 0

apc.shm_size = 64M
