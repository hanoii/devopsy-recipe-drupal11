# Environments of this project. Committed: no secrets here.
# Build mode, devopsy's default: a release uploads the whole project and the
# image is built on the server.
# The host comes from DEVOPSY_TARGET_HOST (or DEVOPSY_TARGET_HOST_PROD), in
# .devopsy/.env or the environment, like DEVOPSY_TARGET_HOST=devopsy@203.0.113.10.
# Each environment also gets <project>.<server's wildcard domain>, from the
# server's Traefik at each release; override it, or set it empty for none,
# with: devopsy @<target> --vars set --show DEVOPSY_WILDCARD_DOMAIN
prod:
  path: /srv/drupal11-prod
  release:
    remote: deploy
  rollback:
    remote: deploy
